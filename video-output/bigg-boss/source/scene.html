<canvas id="c"></canvas>

<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'land';
const LAND = MODE === 'land';
const W = LAND ? 1920 : 1080, H = LAND ? 1080 : 1920, END = 199.6;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const X = cv.getContext('2d');
const T = { bg: '#040505', panel: '#0E141C', panelBorder: '#1E2A38', text: '#F5F5F2', muted: '#8A93A0',
  accent: '#4C9BFF', negative: '#FF4D4D', highlighter: '#FFE14A', paper: '#F3EEDF', gold: '#E8B84A', goldL: '#FFE08A', goldD: '#9C7320' };
const at = i => WORDS[i].start;

// ---------- math ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function bez(x1, y1, x2, y2) { // cubic-bezier easing
  return k => { if (k <= 0) return 0; if (k >= 1) return 1; let lo = 0, hi = 1, m;
    for (let i = 0; i < 24; i++) { m = (lo + hi) / 2; const x = 3 * (1 - m) ** 2 * m * x1 + 3 * (1 - m) * m * m * x2 + m ** 3; if (x < k) lo = m; else hi = m; }
    return 3 * (1 - m) ** 2 * m * y1 + 3 * (1 - m) * m * m * y2 + m ** 3; };
}
const E = bez(0.16, 1, 0.3, 1);
const IN = (t, a, d = .33) => E(P(t, a, a + d));

// ---------- layout ----------
const M = LAND ? 120 : 80;
const TB = LAND ? { x: 120, w: 820, cy: 560 } : { x: 80, w: 920, cy: 560 };   // text block
const BIG = LAND ? { x: 120, w: 1680, cy: 540 } : { x: 80, w: 920, cy: 860 };
const VB = LAND ? { x: 1010, y: 250, s: 0.98 } : { x: 140, y: 930, s: 1.0 };     // 800x720 visual box
const HUD = LAND ? { x: W - 120 - 300, y: 56 } : { x: W - 60 - 300, y: 56 };

const font = (w, s, fam = 'IN, NT', style = '') => `${style} ${w} ${s}px ${fam}`;
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(c, s, x, y, size, col, w = 800, align = 'left', base = 'alphabetic', fam) {
  c.font = font(w, size, fam); c.textAlign = align; c.textBaseline = base; c.fillStyle = col; c.fillText(s, x, y);
}
function wrap(c, s, maxW) {
  const words = s.split(' '), out = []; let line = '';
  for (const w of words) { const tst = line ? line + ' ' + w : w;
    if (c.measureText(tst.replace(/\*/g, '')).width > maxW && line) { out.push(line); line = w; } else line = tst; }
  if (line) out.push(line); return out;
}
// rich text: *word* = accent
function rich(c, s, x, y, base, acc) {
  let cx = x, on = false;
  for (const part of s.split('*')) { if (part) { c.fillStyle = on ? acc : base; c.fillText(part, cx, y); cx += c.measureText(part).width; } on = !on; }
}
const STY = {
  eyebrow: { w: 700, size: LAND ? 26 : 30, color: T.accent, lh: 1.5, gap: 18 },
  h: { w: 800, size: LAND ? 92 : 84, color: T.text, lh: 1.32, gap: 26 },
  big: { w: 800, size: LAND ? 132 : 112, color: T.text, lh: 1.25, gap: 26 },
  num: { w: 800, size: LAND ? 150 : 130, color: T.accent, lh: 1.15, gap: 24 },
  sub: { w: 500, size: LAND ? 40 : 42, color: T.muted, lh: 1.4, gap: 16 },
};
function block(c, t, box, items) {
  const rows = [];
  for (const it of items) {
    const st = STY[it.kind], size = it.size || st.size;
    c.font = font(st.w, size);
    const ls = it.kind === 'eyebrow' ? [it.text] : wrap(c, it.text, box.w);
    ls.forEach((ln, j) => rows.push({ it, ln, st, size, lh: size * st.lh, gap: j === ls.length - 1 ? st.gap : 0 }));
  }
  const total = rows.reduce((a, r) => a + r.lh + r.gap, 0) - (rows.length ? rows[rows.length - 1].gap : 0);
  let y = box.cy - total / 2;
  for (const r of rows) {
    const k = IN(t, r.it.at), out = r.it.until ? 1 - P(t, r.it.until, r.it.until + .2) : 1;
    if (k > 0 && out > 0) {
      c.save(); c.globalAlpha *= k * out; c.font = font(r.st.w, r.size); c.textBaseline = 'middle'; c.textAlign = 'left';
      const yy = y + r.lh / 2 + (1 - k) * 12;
      if (r.it.kind === 'eyebrow') { c.fillStyle = T.accent; c.fillRect(box.x, yy - 2, 24, 3); c.fillStyle = T.accent; c.fillText(r.ln, box.x + 36, yy); }
      else rich(c, r.ln, box.x, yy, r.it.color || r.st.color, r.it.acc || T.accent);
      if (r.it.strike) { const sk = P(t, r.it.strike, r.it.strike + .35); if (sk > 0) {
        c.strokeStyle = T.negative; c.lineWidth = r.size * .08; c.beginPath(); c.moveTo(box.x, yy); c.lineTo(box.x + c.measureText(r.ln.replace(/\*/g, '')).width * E(sk), yy); c.stroke(); } }
      c.restore();
    }
    y += r.lh + r.gap;
  }
}
function vbox(c, fn) { c.save(); c.translate(VB.x, VB.y); c.scale(VB.s, VB.s); fn(c); c.restore(); }
function fade(c, k, fn) { if (k <= 0) return; c.save(); c.globalAlpha *= k; fn(c); c.restore(); }
function enter(c, t, a, x, y, fn, d = .33) { // scale .96->1 + fade, around (x,y)
  const k = IN(t, a, d); if (k <= 0) return;
  c.save(); c.globalAlpha *= k; c.translate(x, y); const s = .96 + .04 * k; c.scale(s, s); c.translate(-x, -y); fn(c, k); c.restore();
}
function panel(c, x, y, w, h, o = {}) {
  rr(c, x, y, w, h, o.r ?? 22); c.fillStyle = o.fill || T.panel; c.fill();
  c.lineWidth = o.bw || 2; c.strokeStyle = o.border || T.panelBorder; c.stroke();
}
const inr = n => { const s = Math.round(n).toString(); if (s.length <= 3) return s; const last = s.slice(-3); let rest = s.slice(0, -3);
  const parts = []; while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); } if (rest) parts.unshift(rest); return parts.join(',') + ',' + last; };
function count(t, a, from, to, d = .4) { return lerp(from, to, E(P(t, a, a + d))); }
function glowC(c, x, y, r, rgb, a) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); }

// ---------- illustrations ----------
function trophy(c, x, y, s, shine = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  glowC(c, 0, -60, 260, '232,184,74', .25 * shine);
  const g = c.createLinearGradient(-120, 0, 120, 0); g.addColorStop(0, T.goldD); g.addColorStop(.45, T.goldL); g.addColorStop(1, T.goldD);
  c.fillStyle = g; c.strokeStyle = g; c.lineWidth = 22;
  c.beginPath(); c.arc(-118, -130, 52, Math.PI * .5, Math.PI * 1.5); c.stroke();
  c.beginPath(); c.arc(118, -130, 52, -Math.PI * .5, Math.PI * .5); c.stroke();
  c.beginPath(); c.moveTo(-120, -200); c.lineTo(120, -200); c.quadraticCurveTo(118, -40, 0, -10); c.quadraticCurveTo(-118, -40, -120, -200); c.fill();
  c.fillRect(-18, -14, 36, 70); rr(c, -70, 56, 140, 26, 6); c.fill(); rr(c, -100, 82, 200, 44, 8); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-60, -150, 14, 40, .3, 0, 7); c.fill();
  c.restore();
}
function person(c, x, y, s, col, o = {}) { // simple bust icon, (x,y) = bottom centre
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  c.beginPath(); c.arc(0, -150, 46, 0, 7); c.fill();
  c.beginPath(); c.moveTo(-90, 0); c.quadraticCurveTo(-90, -92, 0, -92); c.quadraticCurveTo(90, -92, 90, 0); c.fill();
  if (o.q) txt(c, '?', 0, -122, 70, T.text, 800, 'center', 'middle');
  c.restore();
}
function silhouette(c, x, y, s, rim, q, k = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  glowC(c, 0, -170, 260, '76,155,255', .18 * rim);
  c.fillStyle = '#121A24'; c.strokeStyle = `rgba(76,155,255,${.85 * rim})`; c.lineWidth = 4;
  c.beginPath(); c.arc(0, -250, 70, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-150, 0); c.quadraticCurveTo(-150, -160, 0, -160); c.quadraticCurveTo(150, -160, 150, 0); c.closePath(); c.fill(); c.stroke();
  if (q) txt(c, '?', 0, -246, 96, T.accent, 800, 'center', 'middle');
  c.restore();
}
function host(c, x, y, s, k = 1) { // stylised host: suit, shirt, mic — not a likeness
  c.save(); c.translate(x, y); c.scale(s, s);
  glowC(c, 0, -200, 330, '255,225,150', .22 * k);
  // spotlight cone
  c.fillStyle = `rgba(255,240,200,${.05 * k})`; c.beginPath(); c.moveTo(-40, -560); c.lineTo(40, -560); c.lineTo(220, 0); c.lineTo(-220, 0); c.fill();
  c.fillStyle = '#1B2430'; c.beginPath(); c.moveTo(-160, 0); c.quadraticCurveTo(-160, -170, 0, -170); c.quadraticCurveTo(160, -170, 160, 0); c.fill();
  c.fillStyle = '#EDEDE6'; c.beginPath(); c.moveTo(-40, -166); c.lineTo(0, -60); c.lineTo(40, -166); c.fill();
  c.fillStyle = '#3A1F2B'; c.beginPath(); c.moveTo(-10, -150); c.lineTo(10, -150); c.lineTo(14, -80); c.lineTo(0, -64); c.lineTo(-14, -80); c.fill();
  c.fillStyle = '#C8936B'; c.fillRect(-26, -200, 52, 40); c.beginPath(); c.arc(0, -250, 66, 0, 7); c.fill();
  c.fillStyle = '#2A2A2A'; c.beginPath(); c.arc(0, -268, 68, Math.PI * 1.02, Math.PI * 1.98); c.fill();
  // mic in hand
  c.fillStyle = '#C8936B'; rr(c, 90, -150, 44, 54, 18); c.fill();
  c.fillStyle = '#2B2F36'; c.save(); c.translate(112, -150); c.rotate(-.35); rr(c, -9, -90, 18, 92, 6); c.fill();
  c.fillStyle = '#9AA3AD'; c.beginPath(); c.arc(0, -98, 22, 0, 7); c.fill(); c.restore();
  c.restore();
}
function tv(c, x, y, w, h, inner) {
  c.save(); rr(c, x - 14, y - 14, w + 28, h + 28, 24); c.fillStyle = '#1A2230'; c.fill();
  rr(c, x, y, w, h, 12); c.fillStyle = '#0A0F16'; c.fill(); c.save(); c.clip(); inner && inner(c); c.restore();
  c.fillStyle = '#1A2230'; c.fillRect(x + w / 2 - 30, y + h + 14, 60, 40); rr(c, x + w / 2 - 120, y + h + 50, 240, 14, 7); c.fill();
  c.restore();
}
function ring(c, x, y, r, frac, col, wd = 14) {
  c.lineCap = 'round'; c.lineWidth = wd; c.strokeStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke();
  c.strokeStyle = col; c.beginPath(); c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); c.stroke();
}
function bed(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#1C2633';
  rr(c, -170, -40, 340, 70, 14); c.fill(); rr(c, -170, -120, 30, 170, 8); c.fill(); rr(c, 140, -80, 30, 130, 8); c.fill();
  c.fillStyle = '#2C3B4E'; rr(c, -136, -78, 90, 40, 14); c.fill(); c.fillStyle = '#24344A'; rr(c, -40, -64, 176, 30, 10); c.fill();
  c.restore();
}
function receipt(c, x, y, w, h, t, lines, totalLine) {
  c.save(); c.fillStyle = T.paper; c.beginPath(); c.moveTo(x, y); c.lineTo(x + w, y); c.lineTo(x + w, y + h);
  const n = 16; for (let i = n; i >= 0; i--) c.lineTo(x + (w * i) / n, y + h + (i % 2 ? 14 : 0)); c.closePath(); c.fill();
  lines.forEach((l, i) => {
    const k = P(t, l.at, l.at + .45); if (k <= 0) return;
    const ly = y + 80 + i * 76; c.save(); c.beginPath(); c.rect(x, ly - 50, 40 + (w - 40) * E(k), 70); c.clip();
    txt(c, l.a, x + 40, ly, 34, '#3B3B36', 800, 'left', 'alphabetic');
    txt(c, l.b, x + w - 40, ly, 38, l.col || '#23527F', 800, 'right', 'alphabetic');
    c.restore();
    c.strokeStyle = 'rgba(0,0,0,.12)'; c.setLineDash([6, 8]); c.lineWidth = 2; c.beginPath(); c.moveTo(x + 40, ly + 22); c.lineTo(x + w - 40, ly + 22); c.stroke(); c.setLineDash([]);
  });
  if (totalLine) { const k = IN(t, totalLine.at); if (k > 0) { c.globalAlpha *= k; const ty = y + h - 70;
    c.strokeStyle = T.accent; c.lineWidth = 4; rr(c, x + 26, ty - 52, w - 52, 82, 12); c.stroke();
    txt(c, totalLine.a, x + 50, ty, 34, '#3B3B36', 800); txt(c, totalLine.b, x + w - 50, ty + 2, 48, '#1F5FA8', 800, 'right'); } }
  c.restore();
}
function tag(c, s, x, y, col = T.accent, size = 24) {
  c.font = font(700, size); const w = c.measureText(s).width + 28;
  rr(c, x, y, w, size + 18, (size + 18) / 2); c.fillStyle = col; c.fill(); txt(c, s, x + 14, y + size + 3, size, '#06101C', 700); return w;
}
function goldCoin(c, x, y, r) {
  c.fillStyle = T.goldD; c.beginPath(); c.arc(x, y + r * .1, r, 0, 7); c.fill();
  const g = c.createLinearGradient(x - r, y - r, x + r, y + r); g.addColorStop(0, T.goldL); g.addColorStop(1, T.gold);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.strokeStyle = T.goldD; c.lineWidth = r * .07; c.beginPath(); c.arc(x, y, r * .78, 0, 7); c.stroke();
}

// ---------- scenes (each: start time, draw) ----------
const S = [];
const add = (s, f) => S.push({ s, f });

// 1 Hook: winner prize
add(0, (c, t) => {
  vbox(c, c => { enter(c, t, .1, 400, 560, c => trophy(c, 400, 560, 1.15, .6 + .4 * Math.sin(t * 2)), .8); });
  block(c, t, TB, [
    { kind: 'eyebrow', text: 'బిగ్ బాస్ విన్నర్ ప్రైజ్', at: at(0) },
    { kind: 'num', text: '₹35 లక్షలు', at: at(5) },
  ]);
});
// 2 Non-winner takes ~double
add(at(8), (c, t) => {
  vbox(c, c => {
    enter(c, t, at(8), 200, 380, c => { panel(c, 20, 140, 360, 480);
      c.save(); c.translate(200, 330); trophy(c, 0, 0, .42); c.restore();
      txt(c, 'Winner', 200, 450, 34, T.muted, 700, 'center'); txt(c, '₹35L', 200, 540, 76, T.text, 800, 'center'); });
    enter(c, t, at(11), 600, 380, c => { const hot = IN(t, at(17));
      panel(c, 420, 140, 360, 480, { border: hot > 0 ? T.accent : T.panelBorder, bw: 2 + 3 * hot });
      person(c, 600, 380, .9, '#2A3646', { q: true });
      txt(c, 'Trophy లేదు', 600, 450, 34, T.muted, 700, 'center');
      txt(c, hot > 0 ? '≈ 2X' : '?', 600, 540, 76, hot > 0 ? T.accent : T.text, 800, 'center'); });
  });
  block(c, t, TB, [
    { kind: 'eyebrow', text: 'కానీ మీకు తెలుసా?', at: at(8) },
    { kind: 'h', text: 'గెలవకపోయినా *రెట్టింపు* డబ్బు', at: at(11) },
  ]);
});
// 3 The person who never slept in the house
add(at(21), (c, t) => {
  vbox(c, c => {
    enter(c, t, at(24), 400, 520, c => silhouette(c, 400, 520, 1.05, .6 + .4 * Math.sin(t * 2.4), true), .6);
    enter(c, t, at(33), 400, 640, c => { bed(c, 400, 650, .9); const k = IN(t, at(34));
      c.strokeStyle = T.negative; c.lineWidth = 12; c.lineCap = 'round';
      c.beginPath(); c.moveTo(270, 570); c.lineTo(270 + 260 * k, 570 + 130 * k); c.stroke();
      if (k > .5) { c.beginPath(); c.moveTo(530, 570); c.lineTo(530 - 260 * (k * 2 - 1), 570 + 130 * (k * 2 - 1)); c.stroke(); } });
  });
  block(c, t, TB, [
    { kind: 'eyebrow', text: 'ఇంకా ఆశ్చర్యం', at: at(21) },
    { kind: 'h', text: 'అందరికంటే *ఎక్కువ* సంపాదన', at: at(27) },
    { kind: 'sub', text: 'house లో ఒక్క రాత్రి కూడా పడుకోని వ్యక్తి', at: at(33) },
  ]);
});
// 4 Where does the money come from
add(at(38), (c, t) => {
  block(c, t, BIG, [{ kind: 'big', text: 'ఈ డబ్బంతా *ఎక్కడి* నుంచి?', at: at(39) }]);
});
// 5 Every 10-second ad = ~3 lakh
add(at(44), (c, t) => {
  vbox(c, c => {
    tv(c, 70, 150, 660, 380, c => {
      const k = P(t, at(52), at(58) + .4); txt(c, 'AD BREAK', 400, 220, 30, T.muted, 700, 'center');
      ring(c, 400, 345, 92, k, T.accent, 16);
      txt(c, String(Math.max(0, Math.ceil(10 - 10 * k))), 400, 372, 82, T.text, 800, 'center');
      txt(c, 'సెకన్లు', 400, 470, 26, T.muted, 500, 'center');
    });
  });
  block(c, t, TB, [
    { kind: 'eyebrow', text: 'ప్రతి 10 సెకన్ల ad కి', at: at(48) },
    { kind: 'num', text: '₹' + inr(count(t, at(58), 0, 300000, .6)), at: at(58) },
    { kind: 'sub', text: 'channel కి దాదాపు', at: at(55) },
  ]);
});
// 6 How much does the channel earn? Who gets what?
add(at(62), (c, t) => {
  block(c, t, BIG, [
    { kind: 'h', text: 'Channel *ఎంత* సంపాదిస్తుంది?', at: at(62) },
    { kind: 'h', text: 'ఎవరికి *ఎంత* వెళ్తుంది?', at: at(71) },
    { kind: 'sub', text: 'ఈ లెక్క తెలిశాక బిగ్ బాస్ ని ఇంతకు ముందులా చూడలేం', at: at(74), color: T.text },
  ]);
});
// 7 Wordmark
function wordmark(c, x, y, size, k = 1, align = 'left') {
  c.save(); c.globalAlpha *= k; c.font = font(800, size); const w1 = c.measureText('Teja ').width;
  c.font = `italic 400 ${size * 1.08}px IS`; const w2 = c.measureText('Decodes').width;
  const x0 = align === 'center' ? x - (w1 + w2) / 2 : x;
  txt(c, 'Teja ', x0, y, size, T.text, 800); c.font = `italic 400 ${size * 1.08}px IS`; c.fillStyle = T.accent; c.textAlign = 'left'; c.fillText('Decodes', x0 + w1, y);
  c.restore();
}
add(at(84), (c, t) => {
  block(c, t, BIG, [{ kind: 'sub', text: 'నమస్కారం, నేను తేజ్', at: at(84), until: at(87) - .3, color: T.text, size: LAND ? 56 : 56 }]);
  const k = IN(t, at(87), .5);
  if (k > 0) wordmark(c, LAND ? 120 : 80, BIG.cy + 40 + (1 - k) * 12, LAND ? 150 : 120, k);
});
// 8 Disclaimer

// ---------- HUD: running money counter ----------
const HUDK = [[at(196), 60, 'రోజు (TV ads)'], [at(219), 180, 'Weekend episode'], [at(226), 660, 'వారం'], [at(235), 10000, 'Season (TV ads)']];
function money(l) { return l >= 100 ? '₹' + (l / 100).toFixed(l % 100 ? 1 : 0) + ' కో.' : '₹' + Math.round(l) + ' ల.'; }
function hud(c, t) {
  const show = IN(t, at(196), .4) * (1 - P(t, at(341), at(341) + .3)); if (show <= 0) return;
  let i = 0; for (let j = 0; j < HUDK.length; j++) if (t >= HUDK[j][0]) i = j;
  const prev = i ? HUDK[i - 1][1] : 0, v = count(t, HUDK[i][0], prev, HUDK[i][1], .4);
  const costOn = t >= at(259);
  const host = costOn ? count(t, at(259), 0, 4000, .4) : 0, celeb = t >= at(332) ? count(t, at(332), 0, 67.5, .4) : 0;
  c.save(); c.globalAlpha *= show; const { x, y } = HUD, h = costOn ? 196 : 124;
  panel(c, x, y, 300, h, { r: 16 }); txt(c, 'Channel ఆదాయం', x + 20, y + 34, 20, T.muted, 700);
  txt(c, '+' + money(v), x + 20, y + 84, 44, T.accent, 800); txt(c, costOn ? 'Season (TV ads)' : HUDK[i][2], x + 20, y + 110, 18, T.muted, 500);
  if (costOn) { c.fillStyle = T.panelBorder; c.fillRect(x + 20, y + 124, 260, 2);
    txt(c, '−' + money(host + celeb), x + 20, y + 170, 36, T.negative, 800); txt(c, celeb > 0 ? 'Host + Celebrity' : 'Host', x + 280, y + 170, 18, T.muted, 500, 'right'); }
  // day progress bar
  rr(c, x + 20, y + h - 10, 260 * Math.min(1, (t - at(196)) / (at(341) - at(196))), 3, 2); c.fillStyle = T.accent; c.fill();
  c.restore();
}

// ---------- captions (vertical only) ----------
const CHUNKS = (() => { const out = []; let cur = [];
  WORDS.forEach((w, i) => { cur.push(i); const end = /[.,?!]$/.test(w.text) || w.text.endsWith('...');
    if (end || cur.length >= 4) { out.push(cur); cur = []; } }); if (cur.length) out.push(cur); return out; })();
function captions(c, t) {
  let ch = null; for (const k of CHUNKS) { const s = WORDS[k[0]].start, e = WORDS[k[k.length - 1]].end + .15; if (t >= s - .05 && t < e) ch = k; }
  if (!ch) return; const size = 58, y = 1720; c.font = font(800, size); const sp = 16;
  const ws = ch.map(i => c.measureText(WORDS[i].text).width); const tot = ws.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  const sc = Math.min(1, 960 / tot); c.save(); c.translate(W / 2, y); c.scale(sc, sc); let x = -tot / 2;
  ch.forEach((i, j) => { const w = WORDS[i], act = t >= w.start && t < w.end + .1;
    c.font = font(800, size); c.textAlign = 'left'; c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 12; c.strokeStyle = 'rgba(0,0,0,.85)';
    c.strokeText(w.text, x, 0); c.fillStyle = act ? T.highlighter : T.text; c.fillText(w.text, x, 0); x += ws[j] + sp; });
  c.restore();
}

// ---------- frame ----------
const noise = [0, 1, 2, 3].map(s => { const n = document.createElement('canvas'); n.width = n.height = 256; const g = n.getContext('2d'), d = g.createImageData(256, 256);
  let r = 1234 + s * 999; for (let i = 0; i < d.data.length; i += 4) { r = (r * 16807) % 2147483647; const v = r % 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return n; });
const XF = .22;
window.renderFrame = function (t) {
  const c = X; c.save();
  c.fillStyle = T.bg; c.fillRect(0, 0, W, H);
  const vg = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .6); vg.addColorStop(0, 'rgba(255,255,255,0.035)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  let i = 0; for (let j = 0; j < S.length; j++) if (t >= S[j].s) i = j;
  const k = i > 0 ? P(t, S[i].s, S[i].s + XF) : 1;
  if (k < 1) { c.save(); c.globalAlpha = 1 - k; S[i - 1].f(c, t); c.restore(); }
  c.save(); c.globalAlpha = k; S[i].f(c, t); c.restore();
  hud(c, t);
  if (!LAND) captions(c, t);
  c.save(); c.globalAlpha = .35; c.font = `italic 400 ${LAND ? 26 : 30}px IS`; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; c.fillStyle = T.text;
  if (t < 197.3) c.fillText('Teja Decodes', W - (LAND ? 60 : 50), H - (LAND ? 44 : 60)); c.restore();
  c.save(); c.globalAlpha = .03; c.globalCompositeOperation = 'screen'; c.fillStyle = c.createPattern(noise[Math.floor(t * 30) % 4], 'repeat'); c.fillRect(0, 0, W, H); c.restore();
  const fo = P(t, END - .5, END); if (fo > 0) { c.fillStyle = `rgba(4,5,5,${fo})`; c.fillRect(0, 0, W, H); }
  c.restore();
};
